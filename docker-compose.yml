services:
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile

    container_name: disaster-client

    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile

    container_name: disaster-server

    ports:
      - "5000:5000"

    volumes:
      - ./server:/app
      - /app/node_modules

    env_file:
      - .env

    depends_on:
      - mongo

    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: disaster-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: