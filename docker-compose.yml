services:
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: disaster-client
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: disaster-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: disaster-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: