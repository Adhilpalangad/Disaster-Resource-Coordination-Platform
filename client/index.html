<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disaster Resource Coordination Platform | Real-Time Relief Routing</title>
  <meta name="description"
    content="A real-time disaster resource coordination platform connecting citizens, NGOs, volunteers, and administrators during emergencies." />
  <!-- Google Fonts & Custom Display Fonts -->
  <!-- Google Fonts & Custom Display Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/lemon-milk" rel="stylesheet">
  <!-- Inline theme initializer to prevent flash of light theme -->
  <script>
    (function () {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || !theme) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
